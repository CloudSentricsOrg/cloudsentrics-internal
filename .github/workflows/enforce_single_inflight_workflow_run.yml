name: Enforce single inflight workflow run

on: workflow_call

jobs:

  enforce_single_inflight_workflow:
    name: Enforce single inflight workflow run
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check for in-progress or failed workflow run
        uses: actions/github-script@v8
        with:
          script: |
            // this will only get the most recent 30 runs
            const workflowRuns = await github.request('GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'pr_terraform_apply.yml',
              headers: {
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
              }
            });

            // we are only going to care about success or fail. we don't care about queued or skipped
            for (let i = 0; i < workflowRuns.data.workflow_runs.length; i++) {
              let run = workflowRuns.data.workflow_runs[i];

              if (run.id == context.runId || run.head_branch == context.payload.pull_request.head.ref) {
                // ignore runs from our own branch
                continue;
              }

              if (run.status == 'in_progress') {
                core.setFailed(`detected inflight workflow run (#${run.id}). you can retry after that workflow run finishes successfully: ${run.html_url}`);
                return 1;
              }

              if (run.status == 'completed') {
                if (run.conclusion == 'failure') {

                  // failing jobs is only an issue if we have failed in the middle of an apply
                  // check each PR for "apply in progress" label
                  for (let j = 0; j < run.pull_requests.length; j++) {
                    let pr = run.pull_requests[j];

                    const prDetail = await github.request('GET /repos/{owner}/{repo}/pulls/{pull_number}', {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: pr.number,
                      headers: {
                        'Accept': 'application/vnd.github+json',
                        'X-GitHub-Api-Version': '2022-11-28'
                      }
                    });

                    const applyInProgress = prDetail.data.labels.some(label => label.name == 'tf-apply-in-progress');
                    if (applyInProgress) {
                      core.setFailed(`most recent workflow run (#${run.id}) has failed with the tf-apply-in-progress label set. this might have resulted in a partially deployed state, so you must resolve that workflow run before continuing: ${run.html_url}`);
                      return 1;
                    }
                  }
                }

                if (run.conclusion == 'success') {
                  if (run.pull_requests.length == 0) {
                    // the most recent run completed successfully, we can continue with our run
                    return 0;
                  } else {
                    // detected an unmerged branch
                    core.setFailed(`there is a successful workflow run corresponding to an unmerged branch. you must merge the branch before this workflow will run again: ${run.pull_requests[0].url}, run: ${run.html_url}`);
                    return 1;
                  }
                }
              }
            }
